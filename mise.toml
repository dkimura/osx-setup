# Agent CLIs use their official installers and update themselves.
# Orca's cask lives in its own tap, which mise evaluates only with Ruby 3; install the release DMG and let the app update itself.
# Starship uses the Tokyo Night preset; an existing config is left alone.
# GitHub's SSH host keys come from its API over HTTPS instead of trusting ssh-keyscan.
# Hooks run under `sh -o errexit`; pipefail stops a failed curl from passing silently.
[bootstrap.hooks.post-packages]
run = '''
set -o pipefail
test -x ~/.local/bin/claude || curl -fsSL https://claude.ai/install.sh | bash
test -x ~/.local/bin/codex || curl -fsSL https://chatgpt.com/codex/install.sh | sh
if [ ! -d /Applications/Orca.app ]; then
  tmp="$(mktemp -d)"
  curl -fsSL -o "$tmp/orca.dmg" https://github.com/stablyai/orca/releases/latest/download/orca-macos-arm64.dmg
  hdiutil attach -nobrowse -readonly -mountpoint "$tmp/mnt" "$tmp/orca.dmg" >/dev/null
  ditto "$tmp/mnt/Orca.app" /Applications/Orca.app
  hdiutil detach "$tmp/mnt" >/dev/null
  rm -rf "$tmp"
fi
test -e ~/.config/starship.toml || { mkdir -p ~/.config && /opt/homebrew/bin/starship preset tokyo-night -o ~/.config/starship.toml; }
if ! ssh-keygen -F github.com -f ~/.ssh/known_hosts >/dev/null 2>&1; then
  keys="$(curl -fsSL https://api.github.com/meta | /opt/homebrew/bin/jq -r '.ssh_keys[] | "github.com " + .')"
  [ -n "$keys" ] || { echo "failed to fetch GitHub SSH host keys" >&2; exit 1; }
  mkdir -p ~/.ssh && chmod 700 ~/.ssh
  printf '%s\n' "$keys" >> ~/.ssh/known_hosts
fi
'''

# mise writes the Dock preferences but does not restart the Dock to show them.
[bootstrap.hooks.post-defaults]
run = "killall Dock || true"

[bootstrap.macos.dock]
autohide = true
show_recents = false
apps = [
  "/System/Applications/Apps.app",
  "/Applications/Arc.app",
]

[bootstrap.macos.finder]
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleInterfaceStyleSwitchesAutomatically = true, InitialKeyRepeat = 15.0, KeyRepeat = 2.0 }
"com.apple.universalaccess" = { reduceMotion = true }
"com.knollsoft.Rectangle" = { allowAnyShortcut = true, alternateDefaultShortcuts = true, subsequentExecutionMode = 1 }

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.mise_shell_activate]
fish = "activate"

# Docker finds the Compose and buildx formulae only through ~/.docker/cli-plugins; colima owns ~/.docker/config.json.
[dotfiles]
"~/.config/fish/conf.d/direnv.fish" = { source = "dotfiles/fish/conf.d/direnv.fish", mode = "copy" }
"~/.config/fish/fish_plugins" = { source = "dotfiles/fish/fish_plugins" }
"~/.config/fish/config.fish/osx-setup" = { source = "dotfiles/fish/config.fish", comment = "#" }
"~/.config/git/allowed_signers" = { source = "dotfiles/allowed_signers" }
"~/.config/karabiner" = { source = "dotfiles/karabiner" }
"~/.config/mise/config.toml" = { source = "dotfiles/mise/config.toml" }
"~/.docker/cli-plugins/docker-buildx" = { source = "/opt/homebrew/lib/docker/cli-plugins/docker-buildx" }
"~/.docker/cli-plugins/docker-compose" = { source = "/opt/homebrew/lib/docker/cli-plugins/docker-compose" }
"~/.gitconfig/osx-setup" = { source = "dotfiles/gitconfig", comment = "#" }
"~/.gitignore_global" = { source = "dotfiles/gitignore_global", mode = "copy" }
"~/.local/bin/orca" = { source = "/Applications/Orca.app/Contents/Resources/bin/orca" }
"~/Library/LaunchAgents/com.github.abiosoft.colima.plist" = { source = "dotfiles/launchd/com.github.abiosoft.colima.plist", mode = "copy" }
"~/.ssh/config/osx-setup" = { source = "dotfiles/ssh/config", comment = "#" }

[tasks.bootstrap]
description = "Install Fish plugins listed in fish_plugins"
depends = ["skills"]
# fisher update drops plugins it fails to fetch from fish_plugins; restore and fail instead.
run = '''
before="$(cat dotfiles/fish/fish_plugins)"
/opt/homebrew/bin/fish -c 'fisher update'
if [ "$(cat dotfiles/fish/fish_plugins)" != "$before" ] || [ ! -L ~/.config/fish/fish_plugins ]; then
  printf '%s\n' "$before" > dotfiles/fish/fish_plugins
  echo "fisher update failed for some plugins; restored fish_plugins. Run 'mise dot apply ~/.config/fish/fish_plugins' if the link is missing." >&2
  exit 1
fi
'''

[tasks.skills]
description = "Install missing global agent skills"
# The skills CLI cannot restore global skills from ~/.agents/.skill-lock.json, so each line lists a source and its skills.
# Only missing skills are installed; `npx skills update -g` updates the rest. npx comes from node in dotfiles/mise/config.toml.
# With Claude Code alone the CLI copies skills into ~/.claude/skills; adding Codex keeps them in ~/.agents/skills with symlinks.
# npx reads stdin, so it gets /dev/null to leave the list below for the loop.
run = '''
while read -r source skills; do
  missing=""
  for skill in $skills; do
    test -d ~/.agents/skills/"$skill" || missing="$missing $skill"
  done
  if [ -n "$missing" ]; then
    npx -y skills add "$source" -g -a claude-code codex -y -s $missing </dev/null || exit 1
  fi
done <<'EOF'
ayghri/i-have-adhd i-have-adhd
coji/natural-japanese natural-japanese
github/gh-stack gh-stack
humanlayer/skills show-me visual-pr
mattpocock/skills ask-matt code-review codebase-design diagnosing-bugs domain-modeling grill-with-docs implement implement-spec improve-codebase-architecture pr prototype research retro setup-matt-pocock-skills tdd to-spec to-tickets triage wayfinder wizard
mattpocock/skills claude-handoff loop-me setup-ts-deep-modules writing-beats writing-fragments writing-shape
mattpocock/skills git-guardrails-claude-code migrate-to-shoehorn scaffold-exercises setup-pre-commit
mattpocock/skills grill-me grilling handoff teach to-questionnaire wait-what writing-for-agents
nulab/bee using-bee
raine/git-surgeon git-surgeon
stablyai/orca orca-cli orchestration
vercel-labs/agent-browser agent-browser
EOF
'''

[tasks.cleanup]
description = "Remove old Cellar kegs and Cellar directories that hold only a mise lock file"
usage = 'flag "-n --dry-run" help="Print what would be removed without removing it"'
# `mise bootstrap packages prune` removes the keg but leaves Cellar/<name>/.mise-staging.lock behind.
# `mise bootstrap packages upgrade` relinks opt/<name> to the new keg but leaves the old keg in Cellar.
# A keg other than the one opt/<name> points to is removed only if no link under /opt/homebrew points into it;
# after upgrading openssl@3, links still pointed to the old keg. A formula whose opt/<name> is not the newest keg is skipped.
run = '''
links="$(find /opt/homebrew -type l -exec stat -f '%N -> %Y/' {} +)"
remove() {
  if [ "$usage_dry_run" = true ]; then
    echo "would remove $1"
  else
    rm -rf "$1"
    echo "removed $1"
  fi
}
for dir in /opt/homebrew/Cellar/*/; do
  dir="${dir%/}"
  name="${dir##*/}"
  if [ "$(ls -A "$dir")" = ".mise-staging.lock" ]; then
    remove "$dir"
    continue
  fi
  current="$(readlink "/opt/homebrew/opt/$name")" || continue
  current="${current##*/}"
  if [ ! -d "$dir/$current" ]; then
    echo "skipped $name: opt/$name points to a missing keg" >&2
    continue
  fi
  newest="$(ls "$dir" | sort -V | tail -n 1)"
  if [ "$current" != "$newest" ]; then
    echo "skipped $name: opt/$name points to $current but $newest is newer" >&2
    continue
  fi
  for keg in "$dir"/*/; do
    keg="${keg%/}"
    version="${keg##*/}"
    [ "$version" = "$current" ] && continue
    if printf '%s\n' "$links" | awk -v self="$keg/" -v target="Cellar/$name/$version/" \
      'index($0, self) != 1 && index($0, target) { found = 1; exit } END { exit !found }'; then
      echo "kept $keg: links still point into it" >&2
      continue
    fi
    remove "$keg"
  done
done
'''

[doctor.checks.arm64]
description = "Running on Apple Silicon"
run = "test \"$(uname -m)\" = arm64"
hint = "This setup supports Apple Silicon Macs only. Do not run the terminal under Rosetta."

[doctor.checks.clt]
description = "Xcode Command Line Tools are installed"
run = "xcode-select -p"
hint = "Run `xcode-select --install` and wait for it to finish."

[doctor.checks.onepassword-ssh-agent]
description = "1Password SSH agent is running"
run = "test -S \"$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock\""
hint = "Sign in to 1Password and turn on Settings → Developer → Use the SSH agent."
